name: Bug Report
description: Report a problem with the extension
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: Extension Version
      description: What version are you running?
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      description: e.g., Firefox 128, Firefox Nightly 130
      placeholder: "Firefox 128.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which site has the issue?
      options:
        - YouTube
        - Instagram
        - Facebook
        - TikTok
        - Other / General
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Add screenshots if applicable.
