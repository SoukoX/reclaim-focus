name: Feature Request
description: Suggest an idea for the extension
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting a feature!
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds you've tried?
  - type: dropdown
    id: platform
    attributes:
      label: Platform (optional)
      description: Which site does this relate to?
      options:
        - YouTube
        - Instagram
        - Facebook
        - TikTok
        - All / General
